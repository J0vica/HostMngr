
name: Build hostmngr for OpenWrt 24.10.0 x86_64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      SDK_DIR: ${{ github.workspace }}/openwrt-sdk
      SDK_ARCHIVE: openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
      SDK_URL: https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
      LIBEASY_COMMIT: da04ef953af966b47d61a9de3eeeb0c6032c7ce5

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            curl \
            wget \
            xz-utils \
            zstd

      - name: Download OpenWrt SDK
        shell: bash
        run: |
          set -eux

          curl -fL "$SDK_URL" \
            -o "$RUNNER_TEMP/$SDK_ARCHIVE"

          mkdir -p "$RUNNER_TEMP/sdk-extract"

          tar --zstd -xf "$RUNNER_TEMP/$SDK_ARCHIVE" \
            -C "$RUNNER_TEMP/sdk-extract"

          mv "$RUNNER_TEMP/sdk-extract/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64" \
            "$SDK_DIR"

          echo "SDK_DIR=$SDK_DIR"

      - name: Configure all OpenWrt feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SDK_DIR"

          # Restore the SDK's original feeds
          cp feeds.conf.default feeds.conf

          # Add IOPSYS without removing the standard feeds
          if ! grep -q 'iopsys.git' feeds.conf; then
          echo 'src-git iopsys https://dev.iopsys.eu/feed/iopsys.git;devel' >> feeds.conf
          fi

          echo "===== FEED CONFIGURATION ====="
          cat feeds.conf

      - name: Update all feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SDK_DIR"

          ./scripts/feeds update -a

          echo "===== AVAILABLE FEED INDEXES ====="
          ls -lh feeds/*.index

      - name: Check feed indexes and packages
        shell: bash
        run: |
          cd "$SDK_DIR"

          echo "===== FEED INDEXES ====="
          ls -lh feeds/*.index || true

          echo "===== IOPSYS PACKAGE INDEX ====="
          grep -i -E 'Package: (libeasy|hostmngr)' feeds/iopsys.index || true

          echo "===== IOPSYS PACKAGE DIRECTORIES ====="
          find feeds/iopsys -maxdepth 2 -type f -name Makefile \
          | grep -E '/(libeasy|hostmngr)/Makefile' || true

          echo "===== FEED UPDATE ERRORS ====="
          grep -i -E 'error:|fatal:|failed|warning:' \
          "$RUNNER_TEMP/iopsys-update.log" | tail -40 || true

      - name: Install package feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SDK_DIR"

          ./scripts/feeds install -a

          echo "===== CHECK REQUIRED PACKAGES ====="
          find package -type f \( \
          -path '*/libnl/Makefile' -o \
          -path '*/libeasy/Makefile' -o \
          -path '*/hostmngr/Makefile' \
          \) -print

      - name: Install required packages
        shell: bash
        run: |
          set -eux
          cd "$SDK_DIR"

          ./scripts/feeds install -p base libnl
          ./scripts/feeds install -p iopsys libeasy
          ./scripts/feeds install -p iopsys hostmngr

          echo "===== VERIFY INSTALLED PACKAGES ====="
          test -f package/feeds/base/libnl/Makefile
          test -f package/feeds/iopsys/libeasy/Makefile
          test -f package/feeds/iopsys/hostmngr/Makefile

          echo "All three packages are registered."


      - name: Add libnl build dependency to libeasy
        shell: bash
        run: |
          set -eux

          MAKEFILE="$SDK_DIR/feeds/iopsys/libeasy/Makefile"

          if ! grep -q '^PKG_BUILD_DEPENDS' "$MAKEFILE"; then
            sed -i '/^PKG_VERSION:=/a PKG_BUILD_DEPENDS:=libnl' "$MAKEFILE"
          fi

          grep -n -E 'PKG_NAME|PKG_VERSION|PKG_BUILD_DEPENDS|DEPENDS' \
            "$MAKEFILE"

      - name: Fetch exact libeasy source commit
        shell: bash
        run: |
          set -eux

          mkdir -p "$SDK_DIR/dl"

          git clone https://dev.iopsys.eu/hal/libeasy.git \
            "$RUNNER_TEMP/libeasy"

          git -C "$RUNNER_TEMP/libeasy" checkout \
            "$LIBEASY_COMMIT"

          git -C "$RUNNER_TEMP/libeasy" archive \
            --format=tar \
            --prefix=libeasy-7.5.2/ \
            "$LIBEASY_COMMIT" \
            | xz -T0 > \
            "$SDK_DIR/dl/libeasy-7.5.2_${LIBEASY_COMMIT}.tar.xz"

          ls -lh "$SDK_DIR/dl/libeasy-7.5.2_${LIBEASY_COMMIT}.tar.xz"

      - name: Build OpenWrt libnl
        shell: bash
        run: |
          set -eux
          cd "$SDK_DIR"

          make package/feeds/base/libnl/compile V=s

          echo "===== STAGED LIBNL PKG-CONFIG FILES ====="

          find staging_dir/target-x86_64_musl \
            -name 'libnl-3.0.pc' \
            -o -name 'libnl-route-3.0.pc'

          test -f \
            staging_dir/target-x86_64_musl/usr/lib/pkgconfig/libnl-3.0.pc

      - name: Build libeasy
        shell: bash
        run: |
          set -eux
          cd "$SDK_DIR"

          make package/feeds/iopsys/libeasy/compile V=s \
            2>&1 | tee "$RUNNER_TEMP/libeasy-build.log"

      - name: Build hostmngr without Wi-Fi
        shell: bash
        run: |
          set -eux
          cd "$SDK_DIR"

          # HOSTMNGR_PLATFORM_HAS_WIFI is intentionally NOT set.
          # Wi-Fi support is optional and disabled by default.

          make package/feeds/iopsys/hostmngr/compile V=s \
            2>&1 | tee "$RUNNER_TEMP/hostmngr-build.log"

      - name: Collect build artifacts
        if: success()
        shell: bash
        run: |
          set -eux

          ARTIFACT_DIR="$RUNNER_TEMP/hostmngr-artifacts"
          mkdir -p "$ARTIFACT_DIR"

          find "$SDK_DIR/bin/packages" \
            -type f -name '*.ipk' \
            -exec cp -t "$ARTIFACT_DIR" {} +

          cd "$ARTIFACT_DIR"

          find . -maxdepth 1 -type f -name '*.ipk' \
            -exec sha256sum {} + > SHA256SUMS

          echo "===== GENERATED IPK FILES ====="
          ls -lh

      - name: Upload OpenWrt packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hostmngr-openwrt-24.10.0-x86_64
          path: ${{ runner.temp }}/hostmngr-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Show diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "===== LIBEASY BUILD LOG ====="
          if [ -f "$RUNNER_TEMP/libeasy-build.log" ]; then
            tail -200 "$RUNNER_TEMP/libeasy-build.log"
          fi

          echo "===== HOSTMNGR BUILD LOG ====="
          if [ -f "$RUNNER_TEMP/hostmngr-build.log" ]; then
            tail -200 "$RUNNER_TEMP/hostmngr-build.log"
          fi
