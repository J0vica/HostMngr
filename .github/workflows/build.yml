name: Build hostmngr (OpenWrt 24.10.0 x86_64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  OPENWRT_VERSION: "24.10.0"
  SDK_ARCHIVE: "openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
  SDK_URL: "https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
  IOPSYS_FEED_URL: "https://dev.iopsys.eu/feed/iopsys.git"
  IOPSYS_FEED_REF: "devel"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 \
            rsync unzip zlib1g-dev file wget zstd

      - name: Download and unpack official OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          wget --https-only --progress=dot:giga "$SDK_URL" -O "$RUNNER_TEMP/$SDK_ARCHIVE"
          tar --zstd -xf "$RUNNER_TEMP/$SDK_ARCHIVE" \
            -C "$RUNNER_TEMP/openwrt-sdk" --strip-components=1
          echo "SDK_DIR=$RUNNER_TEMP/openwrt-sdk" >> "$GITHUB_ENV"

      - name: Add IOPSYS feed and install package recipes

           
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DIR"

          # Use the public IOPSYS feed recipes for hostmngr and libeasy.
          printf '\nsrc-git iopsys %s;%s\n' "$IOPSYS_FEED_URL" "$IOPSYS_FEED_REF" \
            >> feeds.conf.default

          ./scripts/feeds update iopsys
          ./scripts/feeds install -p iopsys libeasy hostmngr

          echo "Installed IOPSYS package directories:"
          find package/feeds/iopsys -maxdepth 2 -name Makefile -print

          test -f package/feeds/iopsys/hostmngr/Makefile
          test -f package/feeds/iopsys/libeasy/Makefile

#      - name: Show libeasy Makefile
#        shell: bash
#        run: |
#          echo "SDK_DIR=$SDK_DIR"
#          echo "Checking for libeasy Makefile..."
#          ls -la "$SDK_DIR/package/feeds/iopsys/libeasy/"
#          echo "----- MAKEFILE START -----"
#          sed -n '1,240p' "$SDK_DIR/package/feeds/iopsys/libeasy/Makefile"
#          echo "----- MAKEFILE END -----"

      - name: Fetch libeasy source directly from IOPSYS Git
        shell: bash
        run: |
          set -eux

          LIBEASY_COMMIT="da04ef953af966b47d61a9de3eeeb0c6032c7ce5"
          LIBEASY_DIR="/tmp/libeasy"

          rm -rf "$LIBEASY_DIR"
          git clone https://dev.iopsys.eu/hal/libeasy.git "$LIBEASY_DIR"

          git -C "$LIBEASY_DIR" checkout "$LIBEASY_COMMIT"

          mkdir -p "$SDK_DIR/dl"

          git -C "$LIBEASY_DIR" archive \
            --format=tar \
            --prefix=libeasy-7.5.2/ \
            "$LIBEASY_COMMIT" \
            | xz -T0 > "$SDK_DIR/dl/libeasy-7.5.2_${LIBEASY_COMMIT}.tar.xz"

          ls -lh "$SDK_DIR/dl/libeasy-7.5.2_${LIBEASY_COMMIT}.tar.xz"

      - name: Configure SDK packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          printf '%s\n' \
            'CONFIG_PACKAGE_libeasy=m' \
            'CONFIG_PACKAGE_hostmngr=m' \
            >> .config
          make defconfig

#      - name: Build libeasy
#        shell: bash
#       run: |
#          set -euo pipefail
#          cd "$SDK_DIR"
#          make -j"$(nproc)" package/feeds/iopsys/libeasy/compile V=s

      - name: Compile libeasy with verbose diagnostics
        shell: bash
        run: |
          set +e
          echo "===== SDK DIRECTORY ====="
          echo "$SDK_DIR"

          echo "===== AVAILABLE LIBEASY TARGETS ====="
          make package/feeds/iopsys/libeasy/printvars V=s

          echo "===== COMPILE LIBEASY ====="
          make package/feeds/iopsys/libeasy/compile V=s 2>&1 | tee "$RUNNER_TEMP/libeasy-build.log"

          exit ${PIPESTATUS[0]}

      - name: Extract libeasy configuration errors
        if: always()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/libeasy-build.log"

          if [ ! -f "$LOG" ]; then
            echo "Build log was not created."
            exit 0
          fi

          echo "===== CMAKE ERRORS ====="
          grep -in -B 15 -A 30 -E \
            'CMake Error|error:|not found|Could NOT find|No such file|Configuring incomplete' \
            "$LOG" || true

          echo "===== LAST 200 LINES ====="
          tail -200 "$LOG"          

      - name: Show libeasy CMake error logs
        if: failure()
        shell: bash
        run: |
          BUILD_DIR="$SDK_DIR/build_dir/target-x86_64_musl/libeasy-7.5.2"

          echo "===== CMakeError.log ====="
          if [ -f "$BUILD_DIR/CMakeFiles/CMakeError.log" ]; then
            cat "$BUILD_DIR/CMakeFiles/CMakeError.log"
          else
            echo "CMakeError.log not found"
          fi

          echo "===== CMakeOutput.log ====="
          if [ -f "$BUILD_DIR/CMakeFiles/CMakeOutput.log" ]; then
            tail -200 "$BUILD_DIR/CMakeFiles/CMakeOutput.log"
          else
            echo "CMakeOutput.log not found"
          fi

          echo "===== CMakeCache.txt ====="
          if [ -f "$BUILD_DIR/CMakeCache.txt" ]; then
            grep -E 'CMAKE_(C|CXX)_COMPILER:|CMAKE_PREFIX_PATH:|CMAKE_FIND_ROOT_PATH:' \
              "$BUILD_DIR/CMakeCache.txt" || true
          fi

      - name: Build hostmngr without Wi-Fi
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DIR"

          # Explicitly pass the upstream build option as disabled.
          make -j"$(nproc)" package/feeds/iopsys/hostmngr/compile \
            HOSTMNGR_PLATFORM_HAS_WIFI=n V=s

      - name: Collect IPKs and build metadata
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          mkdir -p "$GITHUB_WORKSPACE/dist/ipk"
          find bin/packages -type f -name '*.ipk' -print0 |
            while IFS= read -r -d '' pkg; do
              cp "$pkg" "$GITHUB_WORKSPACE/dist/ipk/"
            done

          if ! find "$GITHUB_WORKSPACE/dist/ipk" -maxdepth 1 \
              -type f -name 'hostmngr_*.ipk' | grep -q .; then
            echo "hostmngr IPK was not produced." >&2
            find bin/packages -type f -name '*.ipk' -print
            exit 1
          fi

          {
            echo "OpenWrt release: $OPENWRT_VERSION"
            echo "Target: x86/64"
            echo "Toolchain: GCC 13.3.0 / musl"
            echo "Wi-Fi integration: disabled"
            echo "IOPSYS feed: $IOPSYS_FEED_URL"
            echo "IOPSYS feed ref: $IOPSYS_FEED_REF"
            echo
            echo "Built packages:"
            find "$GITHUB_WORKSPACE/dist/ipk" -maxdepth 1 \
              -type f -name '*.ipk' -printf '%f\n' | sort
          } > "$GITHUB_WORKSPACE/dist/BUILD-INFO.txt"

          (cd "$GITHUB_WORKSPACE/dist/ipk" && sha256sum *.ipk) \
            > "$GITHUB_WORKSPACE/dist/SHA256SUMS"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: hostmngr-openwrt-24.10.0-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 30
